---
name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64
revision: 2
architecture: arm64
series: stonking # РЕКОМЕНДАЦИЯ: Если 'resolute' еще не полностью доступен на ://ubuntu.com, используйте 'noble' (24.04)
class: preinstalled

rootfs:
  archive: ubuntu
  sources-list-deb822: true
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://ports.ubuntu.com/ubuntu-ports/"
  pocket: updates
  seed:
    urls:
       - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
       #      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/ubuntu.resolute"
    branch: stonking # Должно соответствовать выбранной серии (noble или resolute)
    names:
      - minimal

customization:
  extra-packages:
    - name: "ubuntu-desktop-minimal"
    - name: "linux-firmware"
    - name: "cloud-initramfs-growroot"
    - name: "initramfs-tools"
    - name: "localechooser-data"
    - name: "squashfs-tools"
    - name: "snapd"
    - name: "apparmor"
    - name: "apparmor-utils"
    - name: "apparmor-profiles"
    # Заменено на актуальный метапакет тем для GNOME
     - name: "yaru-theme-gnome"
     - name: "ubuntu-desktop-provision"
  extra-snaps:
    - name: snapd
    - name: core26
    - name: mesa-2604

# ИСПРАВЛЕНИЕ: Вместо сломанного пустого блока 'img:' указываем вывод в формате tar-архива rootfs
artifacts:
  tar:
    architecture: arm64
