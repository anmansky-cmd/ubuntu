---
name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64
revision: 2
architecture: arm64
series: stonking
class: preinstalled

rootfs:
  archive: ubuntu
  sources-list-deb822: true
  # Изменено на строчную запись для более надежного парсинга компонентами ubuntu-image
  components: [main, restricted, universe, multiverse]
  mirror: "http://ubuntu.com"
  pocket: updates
  # Добавляем принудительное включение кармана безопасности, где часто лежат обновления provision-пакетов
  pockets:
    - updates
    - security
  seed:
    urls:
       - "https://launchpad.net"
    branch: stonking
    names:
      - minimal

customization:
  extra-packages:
    - name: "ubuntu-desktop-minimal"
    - name: "linux-firmware"
    - name: "cloud-initramfs-growroot"
    - name: "initramfs-tools"
    - name: "localechooser-data"
    - name: "squashfs-tools"
    - name: "snapd"
    - name: "apparmor"
    - name: "apparmor-utils"
    - name: "apparmor-profiles"
    - name: "yaru-theme-gnome"
    - name: "ubuntu-desktop-provision"
  extra-snaps:
    - name: snapd
    - name: core26
    - name: mesa-2604

artifacts:
  tar:
    architecture: arm64
